name: CI

on:
  push:
    branches: [master]
  pull_request:

# Una tanda por rama: si llegan dos pushes seguidos, el primero se cancela en
# vez de competir por los runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest

    # Un Postgres desechable por tanda. Existe para que las migraciones se
    # apliquen de verdad y para que las pruebas de integración ejerciten las
    # consultas contra un motor real: sin esto el CI pasaba en verde con el
    # cálculo de no leídos completamente roto, porque nada lo tocaba.
    services:
      postgres:
        # `pgvector/pgvector` y no `postgres` a secas: la imagen oficial de
        # Postgres no trae la extensión `vector`, así que la migración de los
        # embeddings fallaba aquí con «extension is not available» mientras en
        # producción se aplicaba sin problema. Lo cazó este mismo paso, que es
        # la tercera vez que lo hace — antes fueron `pg_trgm` y `auth.uid()`.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # El build no necesita credenciales reales — next.config.ts cae a un host
      # de relleno — pero fijarlas mantiene la salida estable entre tandas.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci
      SUPABASE_SERVICE_ROLE_KEY: ci
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm install`, no `npm ci`, y no por comodidad.
      #
      # El lockfile se genera en Windows, donde npm no instala los paquetes
      # opcionales de otras plataformas y por tanto no registra sus
      # dependencias transitivas: @img/sharp-wasm32 declara @emnapi/runtime y
      # @emnapi/core, y ninguno llega al lock. Sobre Linux `npm ci` los echa en
      # falta y se niega a instalar.
      #
      # Comprobado dos veces, la última tras regenerar el lock con `npm audit
      # fix`: vuelve a fallar con esos dos paquetes exactos. Forzar
      # `--os=linux --cpu=x64` sobre `--package-lock-only` tampoco los añade.
      # Se pierde el anclaje exacto de versiones a cambio de que el CI corra;
      # la alternativa real sería generar el lock en Linux, que es un cambio de
      # entorno de desarrollo, no de configuración.
      - run: npm install --no-audit --no-fund

      # Sólo alta y crítica rompen la tanda. Un CI que falla por un aviso «low»
      # de una dependencia transitiva se acaba desactivando, y entonces no
      # protege de nada.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      # Aplicar las migraciones aquí es además la prueba de que son ejecutables
      # sobre una base vacía, que es exactamente lo que `db push` nunca
      # garantizaba.
      - name: Migraciones sobre una base limpia
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      # Sólo Chromium y sólo sus dependencias: bajar los tres navegadores
      # costaría minutos para preguntas que se responden con uno.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Corre contra el build de producción recién hecho. Es la única capa que
      # comprueba que la aplicación cobra vida en un navegador de verdad.
      - name: Smoke tests
        run: npm run test:smoke

# Las pruebas end-to-end no corren aquí a propósito. Necesitan un servidor vivo
# y un Supabase real, y crean cuentas de verdad: ejecutarlas en cada push
# llenaría la base de datos de producción de cuentas y mensajes de prueba.
# Se lanzan a mano con `npm run test:e2e` contra un despliegue concreto.
