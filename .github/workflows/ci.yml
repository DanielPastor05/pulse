name: CI

on:
  push:
    branches: [master]
  pull_request:

# Una tanda por rama: si llegan dos pushes seguidos, el primero se cancela en
# vez de competir por los runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest

    env:
      # `postinstall` ejecuta `prisma generate`, y el datasource declara
      # env("DATABASE_URL") y env("DIRECT_URL"): Prisma exige que existan
      # aunque no apunten a nada, porque generar el cliente no abre conexión.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # El build no necesita credenciales reales — next.config.ts cae a un host
      # de relleno — pero fijarlas mantiene la salida estable entre tandas.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci
      SUPABASE_SERVICE_ROLE_KEY: ci
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm install`, no `npm ci`. El lockfile se genera en Windows y npm no
      # registra ahí las dependencias transitivas de los paquetes opcionales de
      # otras plataformas: @img/sharp-wasm32 declara @emnapi/runtime y su
      # resolución no llega al lock, así que `npm ci` lo rechaza por
      # inconsistente. Regenerarlo desde cero y forzar --os=linux no lo arregla.
      # Se pierde el anclaje exacto de versiones a cambio de que el CI corra.
      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

# Las pruebas end-to-end no corren aquí a propósito. Necesitan un servidor vivo
# y un Supabase real, y crean cuentas de verdad: ejecutarlas en cada push
# llenaría la base de datos de producción de cuentas y mensajes de prueba.
# Se lanzan a mano con `npm run test:e2e` contra un despliegue concreto.
