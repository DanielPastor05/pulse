name: CI

on:
  push:
    branches: [master]
  pull_request:

# Una tanda por rama: si llegan dos pushes seguidos, el primero se cancela en
# vez de competir por los runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest

    # Un Postgres desechable por tanda. Existe para que las migraciones se
    # apliquen de verdad y para que las pruebas de integración ejerciten las
    # consultas contra un motor real: sin esto el CI pasaba en verde con el
    # cálculo de no leídos completamente roto, porque nada lo tocaba.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # El build no necesita credenciales reales — next.config.ts cae a un host
      # de relleno — pero fijarlas mantiene la salida estable entre tandas.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci
      SUPABASE_SERVICE_ROLE_KEY: ci
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci`, que instala exactamente lo que fija el lockfile y falla si se
      # ha desincronizado del package.json. Estuvo en `npm install` una
      # temporada porque el lock generado en Windows no registraba las
      # dependencias transitivas de paquetes opcionales de otras plataformas
      # (@emnapi, vía @img/sharp-wasm32) y `ci` lo rechazaba por inconsistente.
      # Reinstalaciones posteriores lo completaron; si volviera a fallar aquí,
      # ese es el motivo.
      - run: npm ci --no-audit --no-fund

      # Sólo alta y crítica rompen la tanda. Un CI que falla por un aviso «low»
      # de una dependencia transitiva se acaba desactivando, y entonces no
      # protege de nada.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      # Aplicar las migraciones aquí es además la prueba de que son ejecutables
      # sobre una base vacía, que es exactamente lo que `db push` nunca
      # garantizaba.
      - name: Migraciones sobre una base limpia
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      # Sólo Chromium y sólo sus dependencias: bajar los tres navegadores
      # costaría minutos para preguntas que se responden con uno.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Corre contra el build de producción recién hecho. Es la única capa que
      # comprueba que la aplicación cobra vida en un navegador de verdad.
      - name: Smoke tests
        run: npm run test:smoke

# Las pruebas end-to-end no corren aquí a propósito. Necesitan un servidor vivo
# y un Supabase real, y crean cuentas de verdad: ejecutarlas en cada push
# llenaría la base de datos de producción de cuentas y mensajes de prueba.
# Se lanzan a mano con `npm run test:e2e` contra un despliegue concreto.
